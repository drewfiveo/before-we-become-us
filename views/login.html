<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login | Before We Become Us</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>


<main class="login-page">


    <!-- Living background -->

    <div
        class="login-atmosphere"
        aria-hidden="true"
    >

        <div class="login-orbit login-orbit-one"></div>

        <div class="login-orbit login-orbit-two"></div>


        <div class="login-lamp">

            <div class="lamp-glow lamp-glow-large"></div>

            <div class="lamp-glow lamp-glow-medium"></div>


            <div class="lamp-shade">

                <span></span>

            </div>


            <div class="lamp-stem"></div>

            <div class="lamp-base"></div>

        </div>


        <div class="login-dust login-dust-one"></div>

        <div class="login-dust login-dust-two"></div>

        <div class="login-dust login-dust-three"></div>

        <div class="login-dust login-dust-four"></div>

    </div>



    <div class="login-container">


        <section class="login-card">


            <div class="login-brand">


                <a
                    href="/"
                    class="brand"
                >

                    <span class="brand-mark">
                        BWBU
                    </span>


                    <span class="brand-name">
                        Before We Become Us
                    </span>

                </a>


                <a
                    href="/"
                    class="login-back"
                >
                    Back home
                </a>


            </div>



            <div class="login-heading">


                <span class="section-label">
                    Welcome
                </span>


                <h1>
                    Come back<br>
                    to yourself.
                </h1>


                <p>
                    Return to your reflections,
                    thoughts and personal space.
                </p>


            </div>



            <form
                class="login-form"
                id="loginForm"
            >


                <div class="login-field">


                    <label for="email">
                        Email address
                    </label>


                    <div class="login-input-wrap">


                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >


                    </div>


                </div>



                <div class="login-field">


                    <label for="password">
                        Password
                    </label>


                    <div class="login-input-wrap">


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >


                        <button
                            type="button"
                            class="login-password-button"
                            id="togglePassword"
                        >
                            Show
                        </button>


                    </div>


                </div>



                <div class="login-options">


                    <label class="login-remember">


                        <input
                            type="checkbox"
                            name="remember"
                        >


                        <span>
                            Remember me
                        </span>


                    </label>


                    <a
                        href="#"
                        class="login-forgot"
                    >
                        Forgot password?
                    </a>


                </div>



                <p
                    id="loginMessage"
                    class="login-message"
                    aria-live="polite"
                ></p>



                <button
                    type="submit"
                    class="login-submit"
                    id="loginButton"
                >

                    <span>
                        Sign in
                    </span>

                </button>


            </form>



            <div class="login-divider">

                <span>
                    or
                </span>

            </div>



            <p class="login-register">

                Don't have an account?

                <a href="/create-account">
                    Create one
                </a>

            </p>


        </section>



        <p class="login-footer">
            A quiet place to notice what matters.
        </p>


    </div>


</main>



<script>


// ============================================================
// ELEMENTS
// ============================================================

const passwordInput =
    document.getElementById("password");

const togglePassword =
    document.getElementById("togglePassword");

const loginForm =
    document.getElementById("loginForm");

const loginMessage =
    document.getElementById("loginMessage");

const loginButton =
    document.getElementById("loginButton");



// ============================================================
// SHOW / HIDE PASSWORD
// ============================================================

togglePassword.addEventListener(
    "click",
    function () {

        const isPassword =
            passwordInput.type === "password";


        passwordInput.type =
            isPassword
                ? "text"
                : "password";


        togglePassword.textContent =
            isPassword
                ? "Hide"
                : "Show";

    }
);



// ============================================================
// LOGIN
// ============================================================

loginForm.addEventListener(
    "submit",
    async function (event) {

        event.preventDefault();


        loginMessage.textContent = "";

        loginMessage.className =
            "login-message";


        const email =
            document
                .getElementById("email")
                .value
                .trim();


        const password =
            passwordInput.value;


        loginButton.disabled = true;


        loginButton
            .querySelector("span")
            .textContent =
            "Signing in...";


        try {


            const response =
                await fetch(
                    "/api/auth/login",
                    {
                        method: "POST",

                        credentials: "same-origin",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                email,
                                password
                            })
                    }
                );



            const data =
                await response.json();



            if (!response.ok) {


                loginMessage.textContent =
                    data.message ||
                    "We could not sign you in.";


                loginMessage.classList.add(
                    "error"
                );


                return;

            }



            // Login succeeded.

            loginMessage.textContent =
                "Welcome back. Opening your space...";


            loginMessage.classList.add(
                "success"
            );



            // Give the browser a moment
            // to receive the session cookie.

            setTimeout(
                function () {

                    window.location.assign(
                        "/dashboard"
                    );

                },
                500
            );


        } catch (error) {


            console.error(
                "Login request failed:",
                error
            );


            loginMessage.textContent =
                "We could not connect to the platform. Please try again.";


            loginMessage.classList.add(
                "error"
            );


        } finally {


            loginButton.disabled = false;


            loginButton
                .querySelector("span")
                .textContent =
                "Sign in";

        }

    }
);


</script>


</body>

</html>
